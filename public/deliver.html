<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deliver · WildcatEats</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="nav" id="nav"></header>
<main>
  <div class="tabs">
    <button id="tabOpen" class="active">Available deliveries</button>
    <button id="tabMine">My deliveries</button>
  </div>

  <section id="openSection">
    <h1>Make some cash</h1>
    <p class="subtitle">Claim an order, pick it up, and let them know when you've arrived. You keep 75% of the delivery fee.</p>
    <div id="payoutBanner"></div>
    <div id="openList"></div>
  </section>

  <section id="mineSection" style="display:none;">
    <h1>My deliveries</h1>
    <p class="subtitle">Orders you've claimed.</p>
    <div id="mineList"></div>
  </section>
</main>

<script src="/app.js"></script>
<script>
let user = null;
let paymentsEnabled = false;

(async () => {
  user = await requireAuthOrRedirect();
  if (!user) return;
  paymentsEnabled = (await api("/api/stripe/config")).enabled;
  await handleStripeRedirect();
  renderPayoutBanner();
  await refreshOpen();
  await refreshMine();
  setInterval(() => {
    if (document.getElementById("openSection").style.display !== "none") refreshOpen();
    else refreshMine();
  }, 4000);
})();

// Stripe redirects the browser back here after (or mid-) Connect onboarding.
async function handleStripeRedirect() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("stripe_refresh")) {
    // The onboarding link expired before they finished — get a fresh one.
    await startPayoutOnboarding();
    return;
  }
  if (params.has("stripe_return")) {
    const { onboarded } = await api("/api/stripe/connect/check", { method: "POST" });
    user.stripeOnboarded = onboarded;
    history.replaceState(null, "", "/deliver.html");
  }
}

async function startPayoutOnboarding() {
  const { url } = await api("/api/stripe/connect/start", { method: "POST" });
  window.location.href = url;
}

function renderPayoutBanner() {
  const el = document.getElementById("payoutBanner");
  if (!paymentsEnabled || user.stripeOnboarded) {
    el.innerHTML = "";
    return;
  }
  el.innerHTML = `
    <div class="banner warn">
      💳 Set up payouts before you can claim a delivery — takes about 2 minutes.
      <button class="btn gold" id="setupPayoutsBtn" style="margin-left:10px;">Set up payouts</button>
    </div>
  `;
  document.getElementById("setupPayoutsBtn").onclick = startPayoutOnboarding;
}

document.getElementById("tabOpen").onclick = () => switchTab("open");
document.getElementById("tabMine").onclick = () => switchTab("mine");

function switchTab(which) {
  document.getElementById("tabOpen").classList.toggle("active", which === "open");
  document.getElementById("tabMine").classList.toggle("active", which === "mine");
  document.getElementById("openSection").style.display = which === "open" ? "block" : "none";
  document.getElementById("mineSection").style.display = which === "mine" ? "block" : "none";
  if (which === "open") refreshOpen(); else refreshMine();
}

async function refreshOpen() {
  const { orders } = await api("/api/orders/open");
  const list = document.getElementById("openList");
  if (orders.length === 0) {
    list.innerHTML = `<div class="empty">No open orders right now. Check back soon!</div>`;
    return;
  }
  list.innerHTML = orders.map((o, i) => `
    <div class="order-item" style="animation-delay:${Math.min(i, 8) * 0.06}s">
      <div class="top-row">
        <div>
          <div class="store">${escapeHtml(o.store)}</div>
          <div class="hall">→ ${escapeHtml(o.hall)}${o.dropoffDetails ? " · " + escapeHtml(o.dropoffDetails) : ""}</div>
        </div>
        <span class="badge open">Open</span>
      </div>
      <div class="items">${escapeHtml(o.items)}</div>
      <div class="meta">Posted ${timeAgo(o.createdAt)} by ${escapeHtml(o.ordererName)} · You earn: <span class="tip">$${Number(o.runnerEarnings).toFixed(2)}</span></div>
      <button class="btn gold" style="margin-top:10px;" data-id="${o.id}">Claim this delivery</button>
    </div>
  `).join("");

  list.querySelectorAll("button[data-id]").forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "Claiming...";
      try {
        await api(`/api/orders/${btn.dataset.id}/claim`, { method: "POST" });
        switchTab("mine");
      } catch (err) {
        toast(err.message, "error");
        refreshOpen();
      }
    };
  });
}

async function refreshMine() {
  const { orders } = await api("/api/orders/delivering");
  updateLocationSharing(orders);
  const list = document.getElementById("mineList");
  const active = orders.filter(o => o.status !== "delivered");
  const done = orders.filter(o => o.status === "delivered");

  if (orders.length === 0) {
    list.innerHTML = `<div class="empty">You haven't claimed any deliveries yet.</div>`;
    return;
  }

  list.innerHTML = active.map((o, i) => renderMine(o, i)).join("") +
    (done.length ? `<h2 style="font-size:1rem; color:#6b7280; margin-top:24px;">Completed</h2>` + done.map((o, i) => renderMine(o, i)).join("") : "");
  wireChatBlocks(list, user.id);

  orders.forEach(o => {
    const pickedBtn = document.getElementById(`picked-${o.id}`);
    if (pickedBtn) pickedBtn.onclick = () => act(o.id, "picked-up", pickedBtn);

    const arrivedBtn = document.getElementById(`arrived-${o.id}`);
    if (arrivedBtn) arrivedBtn.onclick = () => act(o.id, "arrived", arrivedBtn);

    const deliveredBtn = document.getElementById(`delivered-${o.id}`);
    if (deliveredBtn) deliveredBtn.onclick = () => act(o.id, "delivered", deliveredBtn);
  });
}

// ---------- share live location while actively delivering ----------

let watchId = null;
let activeOrderIds = [];
let lastLocationSentAt = 0;
let locationErrorShown = false;

function updateLocationSharing(orders) {
  activeOrderIds = orders.filter(o => o.status === "claimed" || o.status === "picked_up").map(o => o.id);

  if (activeOrderIds.length === 0) {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    return;
  }
  if (watchId !== null || !navigator.geolocation) return;

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const now = Date.now();
      if (now - lastLocationSentAt < 8000) return; // throttle — no need to hammer the server
      lastLocationSentAt = now;
      const { latitude, longitude } = pos.coords;
      activeOrderIds.forEach(id => {
        api(`/api/orders/${id}/location`, { method: "POST", body: { lat: latitude, lng: longitude } }).catch(() => {});
      });
    },
    () => {
      if (!locationErrorShown) {
        locationErrorShown = true;
        toast("Couldn't access your location — the orderer won't see a live map for this delivery.", "error");
      }
    },
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}

async function act(orderId, action, btn) {
  btn.disabled = true;
  try {
    await api(`/api/orders/${orderId}/${action}`, { method: "POST" });
    refreshMine();
  } catch (err) {
    toast(err.message, "error");
    btn.disabled = false;
  }
}

function renderMine(o, i = 0) {
  const delay = `style="animation-delay:${Math.min(i, 8) * 0.06}s"`;
  let actionBtn = "";
  if (o.status === "claimed") {
    actionBtn = `<button class="btn" id="picked-${o.id}" style="margin-top:10px;">I picked it up</button>`;
  } else if (o.status === "picked_up" && !o.arrivedAt) {
    actionBtn = `<button class="btn gold" id="arrived-${o.id}" style="margin-top:10px;">I'm here! 🔔</button>`;
  } else if (o.status === "picked_up" && o.arrivedAt) {
    actionBtn = `<button class="btn" id="delivered-${o.id}" style="margin-top:10px;">Mark delivered</button>`;
  }

  let arrivedNote = o.arrivedAt && o.status !== "delivered"
    ? `<div class="banner">🔔 You notified them you've arrived</div>` : "";

  return `
    <div class="order-item" ${delay}>
      <div class="top-row">
        <div>
          <div class="store">${escapeHtml(o.store)}</div>
          <div class="hall">→ ${escapeHtml(o.hall)}${o.dropoffDetails ? " · " + escapeHtml(o.dropoffDetails) : ""}</div>
        </div>
        <span class="badge ${o.status}">${STATUS_LABEL[o.status]}</span>
      </div>
      <div class="items">${escapeHtml(o.items)}</div>
      ${arrivedNote}
      <div class="meta">For ${escapeHtml(o.ordererName)} · You earn: <span class="tip">$${Number(o.runnerEarnings).toFixed(2)}</span></div>
      ${chatSectionHtml(o, o.ordererName)}
      ${actionBtn}
    </div>
  `;
}
</script>
</body>
</html>
