<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Food · NovaDash</title>
<link rel="icon" href="/wildcat-eats-logo.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<style>
.record-dot {
  position: absolute;
  top: -3px;
  right: 0;
  width: 5.7px;
  height: 5.7px;
  border-radius: 50%;
  background: red;
  animation: recordBlink 1.5s infinite;
}
@keyframes recordBlink {
  0%, 49.99% { opacity: 1; }
  50%, 99.99% { opacity: 0; }
  100% { opacity: 1; }
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 50;
}
.modal-card {
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.combobox {
  position: relative;
}
.combobox-list {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 220px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-md);
  z-index: 30;
}
.combobox-option {
  padding: 9px 12px;
  cursor: pointer;
  font-size: 0.95rem;
}
.combobox-option:hover, .combobox-option.highlighted {
  background: #eef1f8;
}
.combobox-empty {
  padding: 9px 12px;
  font-size: 0.9rem;
  color: var(--muted);
}
</style>
</head>
<body>
<div class="page-loader" id="pageLoader" role="status" aria-live="polite" aria-label="Loading NovaDash">
  <div class="page-loader-mark">
    <img src="/wildcat-eats-logo.png" alt="" style="width:34px; height:34px; object-fit:contain;" />
  </div>
  <div class="page-loader-bar"><div class="page-loader-bar-fill"></div></div>
</div>
<header class="nav" id="nav"></header>
<main>
  <div class="tabs">
    <button id="tabNew" class="active">Place an order</button>
    <button id="tabMine">My orders</button>
    <div id="liveDeliverers" style="margin-left:auto; align-self:center; position:relative; padding-right:8px; font-size:10pt; color:red; font-weight:600; white-space:nowrap;">
      <span id="liveDeliverersText"></span>
      <span class="record-dot"></span>
    </div>
  </div>

  <section id="newOrderSection">
    <h1>What do you need?</h1>
    <p class="subtitle">Pick a spot, tell us where you are, and a fellow student will bring it to you.</p>
    <div id="errorBox"></div>
    <form id="orderForm" class="card">
      <label for="store">Pick up from</label>
      <select id="store" required></select>

      <label for="storeVendor" id="storeVendorLabel" style="display:none;">Which Restaurant?</label>
      <select id="storeVendor" style="display:none;"></select>

      <label for="hallSearch">Deliver to</label>
      <div class="combobox" id="hallCombobox">
        <input type="text" id="hallSearch" autocomplete="off" placeholder="Start typing a hall name (e.g. &quot;Kat&quot;)..." />
        <input type="hidden" id="hall" />
        <div class="combobox-list" id="hallList"></div>
      </div>

      <label for="dropoffDetails">Room / meeting spot details</label>
      <input type="text" id="dropoffDetails" placeholder="e.g. Room 214, or lobby by the front desk" />

      <label for="items">What did you order? (items, sizes, notes)</label>
      <textarea id="items" placeholder="e.g. Large pepperoni pizza, extra ranch." required></textarea>

      <button class="btn" type="submit" style="margin-top:18px;">Next</button>
    </form>
  </section>

  <section id="myOrdersSection" style="display:none;">
    <h1>My orders</h1>
    <p class="subtitle">Live status of the food you've requested.</p>
    <div id="myOrdersList"></div>
  </section>
</main>

<div id="editOrderOverlay" class="modal-overlay" style="display:none;">
  <div class="card modal-card">
    <h1 style="font-size:1.5rem;">Edit order</h1>
    <div id="editErrorBox"></div>
    <form id="editOrderForm">
      <label for="editHallSearch">Deliver to</label>
      <div class="combobox" id="editHallCombobox">
        <input type="text" id="editHallSearch" autocomplete="off" placeholder="Start typing a hall name..." />
        <input type="hidden" id="editHall" />
        <div class="combobox-list" id="editHallList"></div>
      </div>

      <label for="editDropoffDetails">Room / meeting spot details</label>
      <input type="text" id="editDropoffDetails" placeholder="e.g. Room 214, or lobby by the front desk" />

      <label for="editItems">What did you order? (items, sizes, notes)</label>
      <textarea id="editItems" required></textarea>

      <label for="editTip">Delivery fee ($)</label>
      <input type="number" id="editTip" min="1" step="0.5" />

      <div class="row" style="margin-top:18px;">
        <button class="btn" type="submit">Save changes</button>
        <button class="btn secondary" type="button" id="editCancelBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="pricingOverlay" class="modal-overlay" style="display:none;">
  <div class="card modal-card">
    <h1 style="font-size:1.5rem;">Delivery fee & payment</h1>
    <div id="pricingErrorBox"></div>

    <div id="pricingLoading" class="empty" style="padding:14px 0;">Calculating a recommended price...</div>

    <form id="pricingForm">
      <label for="finalTip">Delivery fee ($)</label>
      <input type="number" id="finalTip" min="1" step="0.5" value="5" required />
      <div id="pricingRecommendedCaption" style="font-style:italic; font-size:0.85rem; color:var(--muted); margin-top:4px;"></div>

      <label for="card-element">Payment method (charged once someone claims your order)</label>
      <div id="card-element" class="card-element"></div>

      <div class="row" style="margin-top:18px;">
        <button class="btn" type="submit">Post order</button>
        <button class="btn secondary" type="button" id="pricingBackBtn">Back</button>
      </div>
    </form>
  </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="/app.js"></script>
<script>
let user = null;
let pollTimer = null;
let stripeClient = null;
let cardElement = null;
let mapboxEnabled = false;

(async () => {
  user = await requireAuthOrRedirect();
  if (!user) return;
  document.getElementById("myOrdersList").innerHTML = skeletonList(2);
  try {
    await loadConfig();
    await initStripe();
    await initMapbox();
    await refreshMine();
    await refreshLiveDeliverers();
  } finally {
    hidePageLoader();
  }
  pollTimer = setInterval(() => {
    refreshMine();
    refreshLiveDeliverers();
  }, 4000);
})();

async function refreshLiveDeliverers() {
  try {
    const { count } = await api("/api/stats/active-deliverers");
    document.getElementById("liveDeliverersText").textContent = `Active Runners: ${count}`;
  } catch (err) {
    // Non-critical — just leave the last known count showing.
  }
}

async function initMapbox() {
  const { enabled, token } = await api("/api/mapbox/config");
  mapboxEnabled = enabled;
  if (enabled) mapboxgl.accessToken = token;
}

let vendorsByBuilding = {};
let allHalls = [];

async function loadConfig() {
  const cfg = await api("/api/config");
  vendorsByBuilding = cfg.vendorsByBuilding || {};
  allHalls = cfg.halls || [];
  const storeSel = document.getElementById("store");
  storeSel.innerHTML = cfg.stores.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  updateStoreVendorField();
  storeSel.onchange = updateStoreVendorField;
}

// Typeahead for "Deliver to": matches anywhere in the hall name OR any of
// its aliases (not just the start), so "Kat" finds "St. Katharine Hall" and
// "don" (Donahue) finds "Spit". Only searches once 2+ characters are typed
// — below that, showing all ~60 places isn't useful. The alias never shows
// up as the picked value — only the primary `name` ever gets stored.
function hallMatchesQuery(hall, query) {
  if (hall.name.toLowerCase().includes(query)) return true;
  return (hall.aliases || []).some((a) => a.toLowerCase().includes(query));
}

function createHallCombobox({ searchInputId, hiddenInputId, listId, comboboxId }) {
  const searchInput = document.getElementById(searchInputId);
  const hiddenInput = document.getElementById(hiddenInputId);
  const list = document.getElementById(listId);
  const container = document.getElementById(comboboxId);
  let matches = [];
  let highlighted = -1;

  function render() {
    if (matches.length === 0) {
      list.style.display = "none";
      list.innerHTML = "";
      return;
    }
    list.innerHTML = matches
      .map((h, i) => `<div class="combobox-option${i === highlighted ? " highlighted" : ""}" data-index="${i}">${escapeHtml(h.name)}</div>`)
      .join("");
    list.style.display = "block";
  }

  function select(name) {
    hiddenInput.value = name;
    searchInput.value = name;
    matches = [];
    highlighted = -1;
    render();
  }

  function updateMatches() {
    // Typing invalidates whatever was previously picked, until a new match is chosen.
    hiddenInput.value = "";
    const query = searchInput.value.trim().toLowerCase();
    matches = query.length < 2 ? [] : allHalls.filter((h) => hallMatchesQuery(h, query));
    highlighted = -1;
    render();
  }

  searchInput.addEventListener("input", updateMatches);
  searchInput.addEventListener("focus", updateMatches);

  searchInput.addEventListener("keydown", (e) => {
    if (!matches.length) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      highlighted = Math.min(highlighted + 1, matches.length - 1);
      render();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      highlighted = Math.max(highlighted - 1, 0);
      render();
    } else if (e.key === "Enter") {
      e.preventDefault();
      select(matches[highlighted >= 0 ? highlighted : 0].name);
    } else if (e.key === "Escape") {
      matches = [];
      highlighted = -1;
      render();
    }
  });

  // mousedown (not click) fires before the input's blur, so the pick
  // registers before the list-closing blur handler would otherwise wipe it.
  list.addEventListener("mousedown", (e) => {
    const option = e.target.closest(".combobox-option");
    if (!option) return;
    e.preventDefault();
    select(matches[Number(option.dataset.index)].name);
  });

  document.addEventListener("click", (e) => {
    if (!container.contains(e.target)) {
      matches = [];
      highlighted = -1;
      render();
    }
  });

  return {
    setValue(hall) {
      select(hall || "");
      if (!hall) hiddenInput.value = "";
    }
  };
}

const hallCombobox = createHallCombobox({
  searchInputId: "hallSearch", hiddenInputId: "hall", listId: "hallList", comboboxId: "hallCombobox"
});
const editHallCombobox = createHallCombobox({
  searchInputId: "editHallSearch", hiddenInputId: "editHall", listId: "editHallList", comboboxId: "editHallCombobox"
});

function updateStoreVendorField() {
  const store = document.getElementById("store").value;
  const label = document.getElementById("storeVendorLabel");
  const vendorSel = document.getElementById("storeVendor");
  const vendors = vendorsByBuilding[store];
  if (vendors && vendors.length) {
    label.style.display = "block";
    vendorSel.style.display = "block";
    vendorSel.required = true;
    vendorSel.innerHTML = vendors.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  } else {
    label.style.display = "none";
    vendorSel.style.display = "none";
    vendorSel.required = false;
    vendorSel.innerHTML = "";
  }
}

function storeValue() {
  const store = document.getElementById("store").value;
  const vendor = document.getElementById("storeVendor").value;
  return vendor ? `${vendor} (${store})` : store;
}

async function initStripe() {
  const { enabled, publishableKey } = await api("/api/stripe/config");
  if (!enabled) {
    document.getElementById("card-element").outerHTML =
      `<div class="empty" style="padding:14px 0;">Payments aren't set up on this server yet.</div>`;
    return;
  }
  stripeClient = Stripe(publishableKey);
  cardElement = stripeClient.elements().create("card");
  // Not mounted yet — the card element lives in the pricing popup, which
  // starts hidden. Stripe Elements can size wrong if mounted while its
  // container is display:none, so it's mounted the first time that popup
  // actually opens instead (see ensureCardMounted()).
}

let cardMounted = false;
function ensureCardMounted() {
  if (cardElement && !cardMounted) {
    cardElement.mount("#card-element");
    cardMounted = true;
  }
}

document.getElementById("tabNew").onclick = () => switchTab("new");
document.getElementById("tabMine").onclick = () => switchTab("mine");

function switchTab(which) {
  document.getElementById("tabNew").classList.toggle("active", which === "new");
  document.getElementById("tabMine").classList.toggle("active", which === "mine");
  document.getElementById("newOrderSection").style.display = which === "new" ? "block" : "none";
  document.getElementById("myOrdersSection").style.display = which === "mine" ? "block" : "none";
  if (which === "mine") refreshMine();
}

const errorBox = document.getElementById("errorBox");

// Step 1: "Next" on the main form just validates what's been filled in so
// far and opens the pricing popup — it doesn't post the order.
document.getElementById("orderForm").onsubmit = (e) => {
  e.preventDefault();
  errorBox.innerHTML = "";
  if (!document.getElementById("hall").value) {
    errorBox.innerHTML = `<div class="error">Please pick a hall from the list.</div>`;
    return;
  }
  openPricingModal();
};

// ---------- pricing popup ----------
// Step 2: shows the pricing agent's recommendation (fetched fresh from
// /api/pricing/recommend using whatever's currently in the main form),
// lets the customer adjust the fee, collects payment, and is what actually
// posts the order.

const pricingOverlay = document.getElementById("pricingOverlay");
const pricingErrorBox = document.getElementById("pricingErrorBox");

async function openPricingModal() {
  pricingErrorBox.innerHTML = "";
  document.getElementById("pricingLoading").style.display = "block";
  document.getElementById("pricingRecommendedCaption").textContent = "";
  document.getElementById("finalTip").value = 5;
  pricingOverlay.style.display = "flex";
  ensureCardMounted();

  try {
    const rec = await api("/api/pricing/recommend", {
      method: "POST",
      body: {
        store: document.getElementById("store").value,
        hall: document.getElementById("hall").value,
        items: document.getElementById("items").value
      }
    });
    document.getElementById("pricingRecommendedCaption").textContent = `Recommended delivery fee: ${rec.recommended_price}`;
    document.getElementById("finalTip").value = Number(String(rec.recommended_price).replace("$", ""));
  } catch (err) {
    pricingErrorBox.innerHTML = `<div class="error">Couldn't get a price recommendation (${escapeHtml(err.message)}) — you can still set a fee manually below.</div>`;
  } finally {
    document.getElementById("pricingLoading").style.display = "none";
  }
}

function closePricingModal() {
  pricingOverlay.style.display = "none";
}

document.getElementById("pricingBackBtn").onclick = closePricingModal;
pricingOverlay.onclick = (e) => {
  if (e.target === pricingOverlay) closePricingModal();
};

document.getElementById("pricingForm").onsubmit = async (e) => {
  e.preventDefault();
  pricingErrorBox.innerHTML = "";
  const submitBtn = e.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  try {
    let stripePaymentMethodId = null;
    if (stripeClient) {
      const { clientSecret } = await api("/api/orders/setup-intent", { method: "POST" });
      const { setupIntent, error } = await stripeClient.confirmCardSetup(clientSecret, {
        payment_method: { card: cardElement }
      });
      if (error) throw new Error(error.message);
      stripePaymentMethodId = setupIntent.payment_method;
    }

    await api("/api/orders", {
      method: "POST",
      body: {
        store: storeValue(),
        hall: document.getElementById("hall").value,
        dropoffDetails: document.getElementById("dropoffDetails").value,
        items: document.getElementById("items").value,
        tip: document.getElementById("finalTip").value,
        stripePaymentMethodId
      }
    });
    document.getElementById("items").value = "";
    document.getElementById("dropoffDetails").value = "";
    if (cardElement) cardElement.clear();
    closePricingModal();
    switchTab("mine");
  } catch (err) {
    pricingErrorBox.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  } finally {
    submitBtn.disabled = false;
  }
};

async function refreshMine() {
  const { orders } = await api("/api/orders/mine");
  const list = document.getElementById("myOrdersList");
  if (orders.length === 0) {
    list.innerHTML = `<div class="empty">You haven't placed any orders yet.</div>`;
    syncMaps([]);
    return;
  }
  const drafts = captureChatDrafts(list);
  list.innerHTML = orders.map((o) => renderOrder(o)).join("");
  wireChatBlocks(list, user.id);
  restoreChatDrafts(list, drafts);
  syncMaps(orders);

  orders.forEach(o => {
    const editBtn = document.getElementById(`edit-${o.id}`);
    if (editBtn) {
      editBtn.onclick = () => openEditModal(o);
    }

    const cancelBtn = document.getElementById(`cancel-${o.id}`);
    if (cancelBtn) {
      cancelBtn.onclick = async () => {
        cancelBtn.disabled = true;
        try {
          await api(`/api/orders/${o.id}/cancel`, { method: "POST" });
          refreshMine();
        } catch (err) {
          toast(err.message, "error");
          cancelBtn.disabled = false;
        }
      };
    }

    const reportBtn = document.getElementById(`report-${o.id}`);
    if (reportBtn) {
      reportBtn.onclick = async () => {
        const reason = prompt("What happened? (e.g. never got the food, wrong order, etc.)");
        if (!reason || !reason.trim()) return;
        reportBtn.disabled = true;
        try {
          await api(`/api/orders/${o.id}/report`, { method: "POST", body: { reason: reason.trim() } });
          refreshMine();
        } catch (err) {
          toast(err.message, "error");
          reportBtn.disabled = false;
        }
      };
    }
  });
}

// ---------- edit order popup ----------
// Only order/hall/items/fee are editable here — the store/vendor picked at
// posting time isn't touched, so it's sent back unchanged on save.

let editingOrder = null;
const editOverlay = document.getElementById("editOrderOverlay");
const editErrorBox = document.getElementById("editErrorBox");

function openEditModal(o) {
  editingOrder = o;
  editErrorBox.innerHTML = "";
  editHallCombobox.setValue(o.hall);
  document.getElementById("editDropoffDetails").value = o.dropoffDetails || "";
  document.getElementById("editItems").value = o.items;
  document.getElementById("editTip").value = o.tip;
  editOverlay.style.display = "flex";
}

function closeEditModal() {
  editOverlay.style.display = "none";
  editingOrder = null;
}

document.getElementById("editCancelBtn").onclick = closeEditModal;
editOverlay.onclick = (e) => {
  if (e.target === editOverlay) closeEditModal();
};

document.getElementById("editOrderForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!editingOrder) return;
  editErrorBox.innerHTML = "";
  if (!document.getElementById("editHall").value) {
    editErrorBox.innerHTML = `<div class="error">Please pick a hall from the list.</div>`;
    return;
  }
  const submitBtn = e.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  try {
    await api(`/api/orders/${editingOrder.id}/edit`, {
      method: "POST",
      body: {
        store: editingOrder.store,
        hall: document.getElementById("editHall").value,
        dropoffDetails: document.getElementById("editDropoffDetails").value,
        items: document.getElementById("editItems").value,
        tip: document.getElementById("editTip").value
      }
    });
    closeEditModal();
    refreshMine();
  } catch (err) {
    editErrorBox.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  } finally {
    submitBtn.disabled = false;
  }
};

function renderOrder(o) {
  let banner = "";
  if (o.arrivedAt && o.status !== "delivered") {
    banner = `<div class="banner">Your runner has arrived!</div>`;
  } else if (o.status === "delivered") {
    banner = `<div class="banner">Delivered — enjoy!</div>`;
  }
  if (o.refundedAt) {
    banner += `<div class="banner warn">Refunded</div>`;
  } else if (o.disputeDismissedAt) {
    banner += `<div class="banner warn">Reported — no refund issued</div>`;
  } else if (o.disputedAt) {
    banner += `<div class="banner warn">Reported — under review</div>`;
  }

  // Admin's replies matter enough that this shouldn't hide behind a
  // collapsed toggle someone has to know exists — auto-expand it.
  let adminChatBlock = "";
  if (o.disputedAt) {
    const adminThreadKey = `admin-${o.id}`;
    ensureThreadOpen(adminThreadKey);
    adminChatBlock = chatSectionHtml(o, "NovaDash Admin", { threadKey: adminThreadKey, endpoint: `/api/orders/${o.id}/admin-messages` });
  }

  let cancelBtn = "";
  let editBtn = "";
  if (o.status === "open") {
    editBtn = `<button class="btn" id="edit-${o.id}" style="margin-top:10px;">Edit order</button>`;
    cancelBtn = `<button class="btn danger" id="cancel-${o.id}" style="margin-top:10px;">Cancel order</button>`;
  }
  let reportBtn = "";
  if (o.status === "delivered" && o.paymentStatus === "paid" && !o.disputedAt) {
    reportBtn = `<button class="btn danger" id="report-${o.id}" style="margin-top:10px;">Report a problem</button>`;
  }

  let runnerLine = "";
  if (o.runnerName) {
    runnerLine = `<div class="meta">Runner: ${escapeHtml(o.runnerName)}</div>`;
  }

  const hasLiveLocation =
    mapboxEnabled && (o.status === "claimed" || o.status === "picked_up") && o.runnerLat != null && o.runnerLng != null;
  const mapBlock = hasLiveLocation
    ? `<div class="map-slot" data-map-slot="${o.id}"></div>`
    : "";

  return `
    <div class="order-item">
      <div class="top-row">
        <div>
          <div class="store">${escapeHtml(o.store)}</div>
          <div class="hall">→ ${escapeHtml(o.hall)}${o.dropoffDetails ? " · " + escapeHtml(o.dropoffDetails) : ""}</div>
        </div>
        <span class="badge ${o.status}">${STATUS_LABEL[o.status]}</span>
      </div>
      <div class="items">${escapeHtml(o.items)}</div>
      ${banner}
      <div class="meta">Posted ${timeAgo(o.createdAt)} · Delivery fee: <span class="tip">$${Number(o.tip).toFixed(2)}</span> · ${o.paymentStatus === "paid" ? "Paid" : o.paymentStatus === "refunded" ? "Refunded" : "Not charged yet"}</div>
      ${runnerLine}
      ${mapBlock}
      ${chatSectionHtml(o, o.runnerName)}
      ${adminChatBlock}
      ${editBtn}
      ${cancelBtn}
      ${reportBtn}
    </div>
  `;
}

// ---------- live runner map ----------
// The order list's innerHTML gets rebuilt on every poll, which would
// normally destroy and recreate each Mapbox instance (flicker, wasted
// map-load quota). Instead we keep one persistent container div per order
// in memory and re-parent it into the freshly rendered slot each time —
// the underlying map survives, only its position in the DOM changes.

const mapInstances = {};
const mapContainers = {};
const markerInstances = {};

function syncMaps(orders) {
  if (!mapboxEnabled) return;
  const activeIds = new Set();

  orders.forEach(o => {
    const hasLocation = (o.status === "claimed" || o.status === "picked_up") && o.runnerLat != null && o.runnerLng != null;
    if (!hasLocation) return;
    activeIds.add(o.id);

    const slot = document.querySelector(`[data-map-slot="${o.id}"]`);
    if (!slot) return;

    if (!mapInstances[o.id]) {
      const container = document.createElement("div");
      container.style.width = "100%";
      container.style.height = "100%";
      mapContainers[o.id] = container;

      const map = new mapboxgl.Map({
        container,
        style: "mapbox://styles/mapbox/streets-v12",
        center: [o.runnerLng, o.runnerLat],
        zoom: 15
      });
      const marker = new mapboxgl.Marker({ color: "#cfa438" }).setLngLat([o.runnerLng, o.runnerLat]).addTo(map);
      mapInstances[o.id] = map;
      markerInstances[o.id] = marker;
    } else {
      markerInstances[o.id].setLngLat([o.runnerLng, o.runnerLat]);
      mapInstances[o.id].easeTo({ center: [o.runnerLng, o.runnerLat], duration: 800 });
    }

    slot.appendChild(mapContainers[o.id]);
    mapInstances[o.id].resize();
  });

  Object.keys(mapInstances).forEach(id => {
    if (!activeIds.has(Number(id))) {
      mapInstances[id].remove();
      delete mapInstances[id];
      delete mapContainers[id];
      delete markerInstances[id];
    }
  });
}
</script>
</body>
</html>
