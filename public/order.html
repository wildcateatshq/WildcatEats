<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Food · WildcatEats</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
</head>
<body>
<header class="nav" id="nav"></header>
<main>
  <div class="tabs">
    <button id="tabNew" class="active">Place an order</button>
    <button id="tabMine">My orders</button>
  </div>

  <section id="newOrderSection">
    <h1>What do you need?</h1>
    <p class="subtitle">Pick a spot, tell us where you are, and a fellow student will bring it to you.</p>
    <div id="errorBox"></div>
    <form id="orderForm" class="card">
      <label for="store">Pick up from</label>
      <select id="store" required></select>

      <label for="hall">Deliver to</label>
      <select id="hall" required></select>

      <label for="dropoffDetails">Room / meeting spot details</label>
      <input type="text" id="dropoffDetails" placeholder="e.g. Room 214, or lobby by the front desk" />

      <label for="items">What do you want? (items, sizes, notes)</label>
      <textarea id="items" placeholder="e.g. Large pepperoni pizza, extra ranch. Venmo @janedoe for the total." required></textarea>

      <label for="tip">Delivery fee — split 75/25 with your runner ($)</label>
      <input type="number" id="tip" min="1" step="0.5" value="5" />

      <label for="card-element">Payment method (charged once someone claims your order)</label>
      <div id="card-element" class="card-element"></div>

      <button class="btn" type="submit" style="margin-top:18px;">Post order</button>
    </form>
  </section>

  <section id="myOrdersSection" style="display:none;">
    <h1>My orders</h1>
    <p class="subtitle">Live status of the food you've requested.</p>
    <div id="myOrdersList"></div>
  </section>
</main>

<script src="https://js.stripe.com/v3/"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="/app.js"></script>
<script>
let user = null;
let pollTimer = null;
let stripeClient = null;
let cardElement = null;
let mapboxEnabled = false;

(async () => {
  user = await requireAuthOrRedirect();
  if (!user) return;
  await loadConfig();
  await initStripe();
  await initMapbox();
  await refreshMine();
  pollTimer = setInterval(refreshMine, 4000);
})();

async function initMapbox() {
  const { enabled, token } = await api("/api/mapbox/config");
  mapboxEnabled = enabled;
  if (enabled) mapboxgl.accessToken = token;
}

async function loadConfig() {
  const cfg = await api("/api/config");
  const storeSel = document.getElementById("store");
  const hallSel = document.getElementById("hall");
  storeSel.innerHTML = cfg.stores.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  hallSel.innerHTML = cfg.halls.map(h => `<option value="${escapeHtml(h)}">${escapeHtml(h)}</option>`).join("");
}

async function initStripe() {
  const { enabled, publishableKey } = await api("/api/stripe/config");
  if (!enabled) {
    document.getElementById("card-element").outerHTML =
      `<div class="empty" style="padding:14px 0;">Payments aren't set up on this server yet.</div>`;
    return;
  }
  stripeClient = Stripe(publishableKey);
  cardElement = stripeClient.elements().create("card");
  cardElement.mount("#card-element");
}

document.getElementById("tabNew").onclick = () => switchTab("new");
document.getElementById("tabMine").onclick = () => switchTab("mine");

function switchTab(which) {
  document.getElementById("tabNew").classList.toggle("active", which === "new");
  document.getElementById("tabMine").classList.toggle("active", which === "mine");
  document.getElementById("newOrderSection").style.display = which === "new" ? "block" : "none";
  document.getElementById("myOrdersSection").style.display = which === "mine" ? "block" : "none";
  if (which === "mine") refreshMine();
}

const errorBox = document.getElementById("errorBox");

document.getElementById("orderForm").onsubmit = async (e) => {
  e.preventDefault();
  errorBox.innerHTML = "";
  const submitBtn = e.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  try {
    let stripePaymentMethodId = null;
    if (stripeClient) {
      const { clientSecret } = await api("/api/orders/setup-intent", { method: "POST" });
      const { setupIntent, error } = await stripeClient.confirmCardSetup(clientSecret, {
        payment_method: { card: cardElement }
      });
      if (error) throw new Error(error.message);
      stripePaymentMethodId = setupIntent.payment_method;
    }

    await api("/api/orders", {
      method: "POST",
      body: {
        store: document.getElementById("store").value,
        hall: document.getElementById("hall").value,
        dropoffDetails: document.getElementById("dropoffDetails").value,
        items: document.getElementById("items").value,
        tip: document.getElementById("tip").value,
        stripePaymentMethodId
      }
    });
    document.getElementById("items").value = "";
    document.getElementById("dropoffDetails").value = "";
    if (cardElement) cardElement.clear();
    switchTab("mine");
  } catch (err) {
    errorBox.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  } finally {
    submitBtn.disabled = false;
  }
};

const seenMineIds = new Set();

async function refreshMine() {
  const { orders } = await api("/api/orders/mine");
  const list = document.getElementById("myOrdersList");
  if (orders.length === 0) {
    list.innerHTML = `<div class="empty">You haven't placed any orders yet.</div>`;
    syncMaps([]);
    seenMineIds.clear();
    return;
  }
  list.innerHTML = orders.map((o, i) => renderOrder(o, i)).join("");
  orders.forEach(o => seenMineIds.add(o.id));
  wireChatBlocks(list, user.id);
  syncMaps(orders);

  orders.forEach(o => {
    const cancelBtn = document.getElementById(`cancel-${o.id}`);
    if (cancelBtn) {
      cancelBtn.onclick = async () => {
        cancelBtn.disabled = true;
        try {
          await api(`/api/orders/${o.id}/cancel`, { method: "POST" });
          refreshMine();
        } catch (err) {
          toast(err.message, "error");
          cancelBtn.disabled = false;
        }
      };
    }

    const reportBtn = document.getElementById(`report-${o.id}`);
    if (reportBtn) {
      reportBtn.onclick = async () => {
        const reason = prompt("What happened? (e.g. never got the food, wrong order, etc.)");
        if (!reason || !reason.trim()) return;
        reportBtn.disabled = true;
        try {
          await api(`/api/orders/${o.id}/report`, { method: "POST", body: { reason: reason.trim() } });
          refreshMine();
        } catch (err) {
          toast(err.message, "error");
          reportBtn.disabled = false;
        }
      };
    }
  });
}

function renderOrder(o, i = 0) {
  const isNew = !seenMineIds.has(o.id);
  const entering = isNew ? "entering" : "";
  const delay = isNew ? `style="animation-delay:${Math.min(i, 8) * 0.06}s"` : "";
  let banner = "";
  if (o.arrivedAt && o.status !== "delivered") {
    banner = `<div class="banner">🔔 Your runner has arrived!</div>`;
  } else if (o.status === "delivered") {
    banner = `<div class="banner">✅ Delivered — enjoy!</div>`;
  }
  if (o.refundedAt) {
    banner += `<div class="banner warn">💸 Refunded</div>`;
  } else if (o.disputedAt) {
    banner += `<div class="banner warn">🚩 Reported — under review</div>`;
  }

  let cancelBtn = "";
  if (o.status === "open") {
    cancelBtn = `<button class="btn danger" id="cancel-${o.id}" style="margin-top:10px;">Cancel order</button>`;
  }
  let reportBtn = "";
  if (o.status === "delivered" && o.paymentStatus === "paid" && !o.disputedAt) {
    reportBtn = `<button class="btn danger" id="report-${o.id}" style="margin-top:10px;">Report a problem</button>`;
  }

  let runnerLine = "";
  if (o.runnerName) {
    runnerLine = `<div class="meta">Runner: ${escapeHtml(o.runnerName)}</div>`;
  }

  const hasLiveLocation =
    mapboxEnabled && (o.status === "claimed" || o.status === "picked_up") && o.runnerLat != null && o.runnerLng != null;
  const mapBlock = hasLiveLocation
    ? `<div class="map-slot" data-map-slot="${o.id}"></div>`
    : "";

  return `
    <div class="order-item ${entering}" ${delay}>
      <div class="top-row">
        <div>
          <div class="store">${escapeHtml(o.store)}</div>
          <div class="hall">→ ${escapeHtml(o.hall)}${o.dropoffDetails ? " · " + escapeHtml(o.dropoffDetails) : ""}</div>
        </div>
        <span class="badge ${o.status}">${STATUS_LABEL[o.status]}</span>
      </div>
      <div class="items">${escapeHtml(o.items)}</div>
      ${banner}
      <div class="meta">Posted ${timeAgo(o.createdAt)} · Delivery fee: <span class="tip">$${Number(o.tip).toFixed(2)}</span> · ${o.paymentStatus === "paid" ? "Paid ✅" : o.paymentStatus === "refunded" ? "Refunded 💸" : "Not charged yet"}</div>
      ${runnerLine}
      ${mapBlock}
      ${chatSectionHtml(o, o.runnerName)}
      ${cancelBtn}
      ${reportBtn}
    </div>
  `;
}

// ---------- live runner map ----------
// The order list's innerHTML gets rebuilt on every poll, which would
// normally destroy and recreate each Mapbox instance (flicker, wasted
// map-load quota). Instead we keep one persistent container div per order
// in memory and re-parent it into the freshly rendered slot each time —
// the underlying map survives, only its position in the DOM changes.

const mapInstances = {};
const mapContainers = {};
const markerInstances = {};

function syncMaps(orders) {
  if (!mapboxEnabled) return;
  const activeIds = new Set();

  orders.forEach(o => {
    const hasLocation = (o.status === "claimed" || o.status === "picked_up") && o.runnerLat != null && o.runnerLng != null;
    if (!hasLocation) return;
    activeIds.add(o.id);

    const slot = document.querySelector(`[data-map-slot="${o.id}"]`);
    if (!slot) return;

    if (!mapInstances[o.id]) {
      const container = document.createElement("div");
      container.style.width = "100%";
      container.style.height = "100%";
      mapContainers[o.id] = container;

      const map = new mapboxgl.Map({
        container,
        style: "mapbox://styles/mapbox/streets-v12",
        center: [o.runnerLng, o.runnerLat],
        zoom: 15
      });
      const marker = new mapboxgl.Marker({ color: "#cfa438" }).setLngLat([o.runnerLng, o.runnerLat]).addTo(map);
      mapInstances[o.id] = map;
      markerInstances[o.id] = marker;
    } else {
      markerInstances[o.id].setLngLat([o.runnerLng, o.runnerLat]);
      mapInstances[o.id].easeTo({ center: [o.runnerLng, o.runnerLat], duration: 800 });
    }

    slot.appendChild(mapContainers[o.id]);
    mapInstances[o.id].resize();
  });

  Object.keys(mapInstances).forEach(id => {
    if (!activeIds.has(Number(id))) {
      mapInstances[id].remove();
      delete mapInstances[id];
      delete mapContainers[id];
      delete markerInstances[id];
    }
  });
}
</script>
</body>
</html>
