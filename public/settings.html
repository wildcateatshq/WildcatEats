<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Settings · NovaDash</title>
<link rel="icon" href="/wildcat-eats-logo.png" type="image/png" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#00205b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="NovaDash" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="page-loader" id="pageLoader" role="status" aria-live="polite" aria-label="Loading NovaDash">
  <div class="page-loader-mark">
    <img src="/wildcat-eats-logo.png" alt="" style="width:34px; height:34px; object-fit:contain;" />
  </div>
  <div class="page-loader-bar"><div class="page-loader-bar-fill"></div></div>
</div>
<header class="nav" id="nav"></header>
<main>
  <h1>Settings</h1>
  <p class="subtitle">Your account details.</p>
  <div class="card">
    <label for="settingsName">Name</label>
    <input type="text" id="settingsName" disabled />

    <label for="settingsEmail">Email</label>
    <input type="text" id="settingsEmail" disabled />

    <label for="settingsPhone">Phone</label>
    <input type="text" id="settingsPhone" disabled />
  </div>

  <div class="card">
    <label style="margin-top:0;">Notifications</label>
    <p class="subtitle" style="margin-bottom:14px;">Get a real notification — even with the app closed — when someone messages you.</p>
    <div id="pushErrorBox"></div>
    <button class="btn" id="pushToggleBtn" type="button">Loading…</button>
  </div>
</main>

<script src="/app.js"></script>
<script>
(async () => {
  const user = await requireAuthOrRedirect();
  if (!user) return;
  document.getElementById("settingsName").value = user.name;
  document.getElementById("settingsEmail").value = user.email;
  document.getElementById("settingsPhone").value = user.phone;
  await refreshPushButton();
  hidePageLoader();
})();

const pushBtn = document.getElementById("pushToggleBtn");
const pushErrorBox = document.getElementById("pushErrorBox");

async function refreshPushButton() {
  const status = await getPushSubscriptionStatus();
  if (status === "unsupported") {
    pushBtn.textContent = "Not supported on this browser";
    pushBtn.disabled = true;
  } else if (status === "denied") {
    pushBtn.textContent = "Blocked — enable in browser settings";
    pushBtn.disabled = true;
  } else if (status === "subscribed") {
    pushBtn.textContent = "Turn off notifications";
    pushBtn.disabled = false;
    pushBtn.dataset.state = "subscribed";
  } else {
    pushBtn.textContent = "Enable notifications";
    pushBtn.disabled = false;
    pushBtn.dataset.state = "unsubscribed";
  }
}

pushBtn.onclick = async () => {
  pushErrorBox.innerHTML = "";
  pushBtn.disabled = true;
  try {
    if (pushBtn.dataset.state === "subscribed") {
      await disablePushNotifications();
    } else {
      await enablePushNotifications();
    }
  } catch (err) {
    pushErrorBox.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  } finally {
    await refreshPushButton();
  }
};
</script>
</body>
</html>
